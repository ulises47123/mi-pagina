<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow: rgba(255, 255, 255, 0.85);
            --glow-soft: rgba(255, 255, 255, 0.25);
            --cyan-glow: rgba(6, 182, 212, 0.5);
            --purple-glow: rgba(168, 85, 247, 0.5);
            --glass: rgba(10, 10, 15, 0.45);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-hover: rgba(255, 255, 255, 0.45);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            background-image: url('bg.webp?v=2');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            color: var(--text);
        }

        /* Canvas de partículas y estrellas reactivas */
        #soundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
        }

        /* ----- TOP BAR: HUD MINIMALISTA (Estilo r/unixporn & macOS Status Bar) ----- */
        .hud-topbar {
            position: relative;
            z-index: 10;
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* IZQUIERDA: MINI REPRODUCTOR CYBER PILL */
        .player-pill {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 7px 18px 7px 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 380px;
        }

        .player-pill:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px var(--glow-soft);
            transform: translateY(-2px);
        }

        /* Disco Vinilo Giratorio */
        .vinyl-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #08080c 75%);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: spinDisc 4s linear infinite;
            animation-play-state: paused;
            transition: all 0.3s ease;
        }

        .vinyl-wrapper.playing {
            animation-play-state: running;
            border-color: #ffffff;
            box-shadow: 0 0 14px var(--glow);
        }

        .vinyl-wrapper svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Título de Pista y Ecualizador de Ritmo */
        .track-box {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
            gap: 3px;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Ondas de sonido estilizadas (Equalizer Waves) */
        .sound-equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 12px;
        }

        .eq-bar {
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
            transition: height 0.1s ease;
            opacity: 0.4;
        }

        .sound-equalizer.active .eq-bar {
            opacity: 1;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        .sound-equalizer.active .eq-bar:nth-child(1) { animation: eqJump 0.8s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(2) { animation: eqJump 1.1s 0.2s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(3) { animation: eqJump 0.6s 0.4s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(4) { animation: eqJump 1.2s 0.1s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(5) { animation: eqJump 0.9s 0.3s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(6) { animation: eqJump 0.7s 0.5s infinite alternate ease-in-out; }

        @keyframes eqJump {
            0% { height: 3px; }
            100% { height: 12px; }
        }

        /* Controles de Reproducción */
        .player-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.12);
        }

        .action-btn-play {
            width: 34px;
            height: 34px;
            background: #ffffff;
            color: #000000;
            border: none;
            box-shadow: 0 0 12px var(--glow);
        }

        .action-btn-play:hover {
            transform: scale(1.15);
            box-shadow: 0 0 18px var(--glow);
        }

        .action-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .action-btn-play svg {
            width: 15px;
            height: 15px;
            fill: #000000;
        }

        /* CENTRO: TOP BAR espaciador para no tapar la cara de Miku */
        .topbar-spacer {
            flex: 1;
        }

        /* BARRA DE BÚSQUEDA FLOTANTE INFERIOR DERECHA (No tapa a Miku en el centro) */
        .bottom-search-wrapper {
            position: fixed;
            bottom: 24px;
            right: 32px;
            z-index: 100;
            display: flex;
            align-items: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-pill-container {
            width: 320px;
            position: relative;
            transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .search-pill-container:focus-within {
            width: 390px;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 42px 10px 46px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: #ffffff;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(12, 14, 22, 0.85);
            box-shadow: 0 0 25px var(--glow-soft), 0 12px 35px rgba(0, 0, 0, 0.85);
        }

        /* Canvas Thinking Orb en reemplazo de la lupa */
        .search-orb-canvas {
            position: absolute;
            left: 14px;
            width: 22px;
            height: 22px;
            pointer-events: none;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
        }

        .search-input:focus ~ .search-orb-canvas {
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
        }

        .search-shortcut-hint {
            position: absolute;
            right: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.5);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }

        /* DERECHA: ACCESOS DIRECTOS DOCK */
        .shortcuts-dock {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .shortcuts-dock:hover {
            border-color: var(--glass-border-hover);
        }

        /* ----- BOTÓN Y MENÚ DESPLEGABLE DE IA (DROPDOWN MODERNO) ----- */
        .ai-dropdown-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .ai-pill-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            border-radius: 50px;
            padding: 6px 14px 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .ai-pill-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            opacity: 0.85;
            transition: transform 0.25s ease;
        }

        .ai-dropdown-wrapper:hover .ai-pill-btn {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            box-shadow: 0 6px 20px var(--glow-soft);
            transform: translateY(-2px);
        }

        .ai-dropdown-wrapper:hover .ai-pill-btn svg {
            transform: rotate(180deg);
        }

        /* Menú Flotante que se despliega al pasar el ratón */
        .ai-dropdown-menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(8px) scale(0.94);
            background: rgba(14, 16, 24, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 18px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 255, 255, 0.08);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 120;
            min-width: 250px;
        }

        /* Puente invisible para que el cursor no pierda el hover al bajar al menú */
        .ai-dropdown-menu::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 0;
            width: 100%;
            height: 16px;
        }

        .ai-dropdown-wrapper:hover .ai-dropdown-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* Item individual de cada IA dentro del menú */
        .ai-menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 6px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ai-menu-item:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        .ai-menu-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .ai-menu-item span {
            font-size: 0.68rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
        }

        /* ELEMENTOS ESTÁNDAR DEL DOCK (DEV, HERRAMIENTAS, ESTUDIO) */
        .dock-item {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--glass-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            transform: translateY(-4px) scale(1.18);
            box-shadow: 0 6px 20px var(--glow-soft);
            z-index: 10;
        }

        .dock-item img {
            width: 19px;
            height: 19px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
            transition: transform 0.25s ease;
        }

        .dock-item:hover img {
            transform: scale(1.1);
        }

        /* Tooltip normal para elementos fuera de la sección IA */
        .dock-item .tooltip {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .dock-item:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* Divisor elegante en el dock */
        .dock-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 3px;
            flex-shrink: 0;
        }

        /* Teclado Atajos Footer minimalista */
        .hud-footer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            font-size: 0.75rem;
            color: var(--text-dim);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .key-hints {
            display: flex;
            gap: 12px;
            background: rgba(10, 10, 15, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .kbd-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
        }

        /* Animaciones */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .hud-topbar {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .player-pill, .shortcuts-dock {
                max-width: 100%;
                justify-content: center;
            }
            .shortcuts-dock {
                overflow-x: auto;
                max-width: 100%;
            }
            .bottom-search-wrapper {
                position: relative;
                bottom: auto;
                right: auto;
                margin-top: 15px;
                width: 100%;
                justify-content: center;
            }
            .search-pill-container {
                width: 100%;
                max-width: 380px;
            }
            .hud-footer {
                flex-direction: column-reverse;
                align-items: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas de ondas estelares reactivas a la música (no obstructivo) -->
    <canvas id="soundCanvas"></canvas>

    <!-- TOP HUD: Barra Superior Cyberpunk / Startpage Minimalista -->
    <header class="hud-topbar">
        
        <!-- IZQUIERDA: Mini Reproductor Dynamic Pill -->
        <div class="player-pill">
            <div class="vinyl-wrapper" id="vinylDisc">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>

            <div class="track-box">
                <span class="track-title" id="trackTitle">Esperón - Tristella</span>
                <div class="sound-equalizer" id="soundEq">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>

            <div class="player-actions">
                <button class="action-btn" id="prevBtn" title="Anterior (←)">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button class="action-btn action-btn-play" id="playBtn" title="Play / Pausa (Espacio)">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <button class="action-btn" id="nextBtn" title="Siguiente (→)">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <audio id="audioElement" preload="auto"></audio>
        </div>

        <!-- ESPACIADOR: Deja la zona central completamente despejada para la cara y el halo de Miku -->
        <div class="topbar-spacer"></div>

        <!-- DERECHA: Dock Flotante de Accesos Rápidos con Tooltips -->
        <nav class="shortcuts-dock">
            
            <!-- BOTÓN DESPLEGABLE DE IA -->
            <div class="ai-dropdown-wrapper">
                <button type="button" class="ai-pill-btn">
                    <span>IA</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </button>
                <div class="ai-dropdown-menu">
                    <a href="https://chat.deepseek.com/" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/deepseek.svg" alt="DeepSeek">
                        <span>DeepSeek</span>
                    </a>
                    <a href="https://claude.ai" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/claude.svg" alt="Claude">
                        <span>Claude</span>
                    </a>
                    <a href="https://gemini.google.com" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/gemini.svg" alt="Gemini">
                        <span>Gemini</span>
                    </a>
                    <a href="https://chat.qwen.ai/" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/qwen.svg" alt="Qwen">
                        <span>Qwen</span>
                    </a>
                    <a href="https://kimi.moonshot.cn/" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/kimi.svg" alt="Kimi">
                        <span>Kimi</span>
                    </a>
                    <a href="https://notebooklm.google.com/" class="ai-menu-item" target="_blank" rel="noopener">
                        <img src="icons/notebooklm.svg" alt="NotebookLM">
                        <span>NotebookLM</span>
                    </a>
                </div>
            </div>

            <div class="dock-divider"></div>

            <!-- Dev & Tools -->
            <a href="https://github.com" class="dock-item">
                <img src="icons/github.svg" alt="GitHub">
                <span class="tooltip">GitHub</span>
            </a>

            <a href="https://skills.sh/" class="dock-item">
                <img src="icons/skills.svg" alt="Skills.sh">
                <span class="tooltip">Skills.sh</span>
            </a>

            <a href="https://www.reddit.com/" class="dock-item">
                <img src="icons/reddit.svg" alt="Reddit">
                <span class="tooltip">Reddit</span>
            </a>

            <a href="https://www.instagram.com/" class="dock-item">
                <img src="icons/instagram.svg" alt="Instagram">
                <span class="tooltip">Instagram</span>
            </a>

            <a href="https://mail.google.com" class="dock-item">
                <img src="icons/gmail.svg" alt="Gmail">
                <span class="tooltip">Gmail</span>
            </a>

            <a href="https://youtube.com" class="dock-item">
                <img src="icons/youtube.svg" alt="YouTube">
                <span class="tooltip">YouTube</span>
            </a>

            <div class="dock-divider"></div>

            <!-- Study -->
            <a href="https://classroom.google.com/" class="dock-item">
                <img src="icons/classroom.svg" alt="Classroom">
                <span class="tooltip">Google Classroom</span>

    <!-- Jakub Antalik - Thinking Orbs Canvas Engine (Optimizado e Integrado) -->
    <script>
    (function initThinkingOrb() {
        const orbCanvas = document.getElementById('searchOrbCanvas');
        if (!orbCanvas) return;
        const octx = orbCanvas.getContext('2d');
        if (!octx) return;

        const size = 22; // Renderizado nítido en 22px con DPR=2 (canvas físico 44x44)
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        orbCanvas.width = Math.round(size * dpr);
        orbCanvas.height = Math.round(size * dpr);

        // Algoritmo matemático original de Jakub Antalik (Thinking Orbs - Globe mode para Searching)
        const spin = 0.52;
        const cx = size / 2;
        const cy = size / 2;
        const radius = (size / 2) * 0.84;
        const latRings = 9;
        const lonDensity = 22;
        const rs = Math.pow(size / 300, 0.6) * 1.7; // Escala adaptada para 22px inline
        const speed = 2.4;

        function angleDelta(a, b) {
            return Math.atan2(Math.sin(a - b), Math.cos(a - b));
        }

        let isHoveredOrFocused = false;
        const searchInputEl = document.getElementById('searchInput');
        if (searchInputEl) {
            searchInputEl.addEventListener('focus', () => { isHoveredOrFocused = true; });
            searchInputEl.addEventListener('blur', () => { isHoveredOrFocused = false; });
        }

        function drawFrame(nowSec) {
            octx.setTransform(dpr, 0, 0, dpr, 0, 0);
            octx.clearRect(0, 0, size, size);

            const t = nowSec * (isHoveredOrFocused ? speed * 1.6 : speed);
            const tilt = 0.4 + 0.08 * Math.sin(t * 0.35);
            const st = Math.sin(tilt);
            const ct = Math.cos(tilt);
            const sy = Math.sin(t * spin);
            const cyw = Math.cos(t * spin);

            // Proyector ortográfico 3D
            const proj = (x, y, z) => {
                const x1 = x * cyw + z * sy;
                const z1 = -x * sy + z * cyw;
                const y1 = y * ct - z1 * st;
                const z2 = y * st + z1 * ct;
                return [cx + x1 * radius, cy - y1 * radius, z2];
            };

            const scan = t * (spin + 1.2 * 3.8);
            const dots = [];

            for (let li = 0; li <= latRings; li++) {
                const lat = -Math.PI / 2 + (li / latRings) * Math.PI;
                const cosLat = Math.cos(lat);
                const sinLat = Math.sin(lat);
                const lonCount = Math.max(1, Math.round(Math.abs(cosLat) * lonDensity));

                for (let lj = 0; lj < lonCount; lj++) {
                    const lon = (lj / lonCount) * 2 * Math.PI;
                    const [px, py, z] = proj(cosLat * Math.cos(lon), sinLat, cosLat * Math.sin(lon));
                    const depth = (z + 1) / 2;

                    // Onda de escaneo (Scan ripple)
                    const d = angleDelta(lon + t * spin, scan);
                    const boost = Math.exp(-(d * d) / 0.2) * Math.max(0, z);

                    const r = Math.max(0.4, (0.5 + 1.6 * depth + 0.9 * boost) * rs);
                    const white = 0.62 - 0.54 * depth;
                    const alpha = 0.35 + 0.65 * Math.min(1, boost * 1.4 + depth * 0.4);

                    dots.push({ x: px, y: py, z, r, white, a: alpha });
                }
            }

            // Ordenamiento por profundidad Z (far -> near)
            dots.sort((a, b) => a.z - b.z);

            // Pintado en Canvas 2D
            for (let i = 0; i < dots.length; i++) {
                const pt = dots[i];
                // En dark substrate, invertimos para que los puntos frontales brillen en blanco/cyan
                const w = Math.min(1, Math.max(0, pt.white));
                const g = Math.round((1 - w) * 255);
                
                if (isHoveredOrFocused) {
                    octx.fillStyle = `rgba(0, ${Math.min(255, g + 80)}, 255, ${pt.a})`;
                } else {
                    octx.fillStyle = `rgba(${g}, ${g}, ${Math.min(255, g + 25)}, ${pt.a})`;
                }

                octx.beginPath();
                octx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                octx.fill();
            }
        }

        let raf = 0;
        let running = true;
        function loop() {
            if (running) {
                drawFrame(performance.now() / 1000);
                raf = requestAnimationFrame(loop);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                running = false;
                cancelAnimationFrame(raf);
            } else {
                running = true;
                raf = requestAnimationFrame(loop);
            }
        });

        raf = requestAnimationFrame(loop);
    })();
    </script>
