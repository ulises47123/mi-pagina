<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow: rgba(255, 255, 255, 0.85);
            --glow-soft: rgba(255, 255, 255, 0.25);
            --cyan-glow: rgba(6, 182, 212, 0.5);
            --purple-glow: rgba(168, 85, 247, 0.5);
            --glass: rgba(10, 10, 15, 0.45);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-hover: rgba(255, 255, 255, 0.45);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            background-image: url('bg.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 32px;
            color: var(--text);
        }

        /* Canvas sutil de partículas de sonido reactivas */
        #soundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ----- TOP BAR: HUD MINIMALISTA (Estilo r/unixporn & macOS Status Bar) ----- */
        .hud-topbar {
            position: relative;
            z-index: 10;
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* IZQUIERDA: MINI REPRODUCTOR CYBER PILL */
        .player-pill {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 7px 18px 7px 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 380px;
        }

        .player-pill:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px var(--glow-soft);
            transform: translateY(-2px);
        }

        /* Disco Vinilo Giratorio */
        .vinyl-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #08080c 75%);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: spinDisc 4s linear infinite;
            animation-play-state: paused;
            transition: all 0.3s ease;
        }

        .vinyl-wrapper.playing {
            animation-play-state: running;
            border-color: #ffffff;
            box-shadow: 0 0 14px var(--glow);
        }

        .vinyl-wrapper svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Título de Pista y Ecualizador de Ritmo */
        .track-box {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
            gap: 3px;
        }

        .track-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Ondas de sonido estilizadas (Equalizer Waves) */
        .sound-equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 12px;
        }

        .eq-bar {
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
            transition: height 0.1s ease;
            opacity: 0.4;
        }

        .sound-equalizer.active .eq-bar {
            opacity: 1;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        .sound-equalizer.active .eq-bar:nth-child(1) { animation: eqJump 0.8s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(2) { animation: eqJump 1.1s 0.2s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(3) { animation: eqJump 0.6s 0.4s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(4) { animation: eqJump 1.2s 0.1s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(5) { animation: eqJump 0.9s 0.3s infinite alternate ease-in-out; }
        .sound-equalizer.active .eq-bar:nth-child(6) { animation: eqJump 0.7s 0.5s infinite alternate ease-in-out; }

        @keyframes eqJump {
            0% { height: 3px; }
            100% { height: 12px; }
        }

        /* Controles de Reproducción */
        .player-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.12);
        }

        .action-btn-play {
            width: 34px;
            height: 34px;
            background: #ffffff;
            color: #000000;
            border: none;
            box-shadow: 0 0 12px var(--glow);
        }

        .action-btn-play:hover {
            transform: scale(1.15);
            box-shadow: 0 0 18px var(--glow);
        }

        .action-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .action-btn-play svg {
            width: 15px;
            height: 15px;
            fill: #000000;
        }

        /* CENTRO: BARRA DE BÚSQUEDA SPOTLIGHT STEALTH */
        .search-center {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .search-pill-container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .search-form {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 11px 40px 11px 42px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .search-input:focus {
            border-color: #ffffff;
            background: rgba(15, 15, 24, 0.75);
            box-shadow: 0 0 25px var(--glow-soft), 0 10px 30px rgba(0, 0, 0, 0.8);
            transform: scale(1.02);
        }

        .search-icon-left {
            position: absolute;
            left: 15px;
            width: 16px;
            height: 16px;
            fill: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .search-input:focus ~ .search-icon-left {
            fill: #ffffff;
        }

        .search-shortcut-hint {
            position: absolute;
            right: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.5);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }

        /* DERECHA: ACCESOS DIRECTOS DOCK */
        .shortcuts-dock {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .shortcuts-dock:hover {
            border-color: var(--glass-border-hover);
        }

        .dock-item {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--glass-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: #ffffff;
            transform: translateY(-4px) scale(1.18);
            box-shadow: 0 6px 20px var(--glow-soft);
        }

        .dock-item img {
            width: 19px;
            height: 19px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* Tooltip Flotante */
        .dock-item .tooltip {
            position: absolute;
            top: 48px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .dock-item:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* Divisor elegante en el dock */
        .dock-divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 2px;
        }

        /* Teclado Atajos Footer minimalista */
        .hud-footer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            font-size: 0.75rem;
            color: var(--text-dim);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .key-hints {
            display: flex;
            gap: 12px;
            background: rgba(10, 10, 15, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .kbd-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
        }

        /* Animaciones */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .hud-topbar {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .player-pill, .search-center, .shortcuts-dock {
                max-width: 100%;
                justify-content: center;
            }
            .shortcuts-dock {
                overflow-x: auto;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas de ondas estelares reactivas a la música (no obstructivo) -->
    <canvas id="soundCanvas"></canvas>

    <!-- TOP HUD: Barra Superior Cyberpunk / Startpage Minimalista -->
    <header class="hud-topbar">
        
        <!-- IZQUIERDA: Mini Reproductor Dynamic Pill -->
        <div class="player-pill">
            <div class="vinyl-wrapper" id="vinylDisc">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>

            <div class="track-box">
                <span class="track-title" id="trackTitle">Esperón - Tristella</span>
                <div class="sound-equalizer" id="soundEq">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>

            <div class="player-actions">
                <button class="action-btn" id="prevBtn" title="Anterior (←)">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button class="action-btn action-btn-play" id="playBtn" title="Play / Pausa (Espacio)">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <button class="action-btn" id="nextBtn" title="Siguiente (→)">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <audio id="audioElement" preload="auto"></audio>
        </div>

        <!-- CENTRO: Buscador Stealth Spotlight -->
        <div class="search-center">
            <div class="search-pill-container">
                <form class="search-form" action="https://search.brave.com/search" method="GET">
                    <input type="text" id="searchInput" name="q" class="search-input" placeholder="Buscar en Brave..." autocomplete="off">
                    <svg class="search-icon-left" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <span class="search-shortcut-hint">/</span>
                </form>
            </div>
        </div>

        <!-- DERECHA: Dock Flotante de Accesos Rápidos con Tooltips -->
        <nav class="shortcuts-dock">
            
            <!-- IA Models -->
            <a href="https://chat.deepseek.com/" class="dock-item">
                <img src="icons/deepseek.svg" alt="DeepSeek">
                <span class="tooltip">DeepSeek</span>
            </a>

            <a href="https://claude.ai" class="dock-item">
                <img src="icons/claude.svg" alt="Claude">
                <span class="tooltip">Claude</span>
            </a>

            <a href="https://gemini.google.com" class="dock-item">
                <img src="icons/gemini.svg" alt="Gemini">
                <span class="tooltip">Gemini</span>
            </a>

            <a href="https://kimi.moonshot.cn/" class="dock-item">
                <img src="icons/kimi.svg" alt="Kimi">
                <span class="tooltip">Kimi</span>
            </a>

            <a href="https://notebooklm.google.com/" class="dock-item">
                <img src="icons/notebooklm.svg" alt="NotebookLM">
                <span class="tooltip">NotebookLM</span>
            </a>

            <div class="dock-divider"></div>

            <!-- Dev & Tools -->
            <a href="https://github.com" class="dock-item">
                <img src="icons/github.svg" alt="GitHub">
                <span class="tooltip">GitHub</span>
            </a>

            <a href="https://mail.google.com" class="dock-item">
                <img src="icons/gmail.svg" alt="Gmail">
                <span class="tooltip">Gmail</span>
            </a>

            <a href="https://youtube.com" class="dock-item">
                <img src="icons/youtube.svg" alt="YouTube">
                <span class="tooltip">YouTube</span>
            </a>

            <div class="dock-divider"></div>

            <!-- Study -->
            <a href="https://ies5tello-juj.infd.edu.ar/aula/acceso.cgi" class="dock-item">
                <img src="icons/ies_tello.svg" alt="IES Tello">
                <span class="tooltip">IES Tello</span>
            </a>

        </nav>

    </header>

    <!-- FOOTER: Atajos Rápidos de Teclado -->
    <footer class="hud-footer">
        <div class="key-hints">
            <span class="key-hint"><span class="kbd-badge">/</span> Buscar</span>
            <span class="key-hint"><span class="kbd-badge">Espacio</span> Play/Pausa</span>
            <span class="key-hint"><span class="kbd-badge">←</span> <span class="kbd-badge">→</span> Pista</span>
        </div>
    </footer>

    <script>
        const playlist = [
            { title: "Esperón - Tristella", file: "music/track_1.mp3" },
            { title: "ANRI - I Can't Stop The Loneliness", file: "music/track_2.mp3" },
            { title: "Sidney Gish - Impostor Syndrome", file: "music/track_3.mp3" },
            { title: "Jósean Log - Doma", file: "music/track_4.mp3" },
            { title: "Son las 5 de la mañana", file: "music/track_5.mp3" }
        ];

        let songIndex = 0;
        let isAudioPlaying = false;

        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const vinylDisc = document.getElementById('vinylDisc');
        const soundEq = document.getElementById('soundEq');
        const trackTitle = document.getElementById('trackTitle');
        const searchInput = document.getElementById('searchInput');

        audio.volume = 1.0;

        function loadSong(index) {
            songIndex = index;
            const song = playlist[songIndex];
            audio.src = song.file;
            trackTitle.textContent = song.title;
        }

        function togglePlay() {
            if (isAudioPlaying) {
                audio.pause();
            } else {
                audio.volume = 1.0;
                audio.play().catch(e => console.error(e));
            }
        }

        function prevTrack() {
            songIndex = (songIndex - 1 + playlist.length) % playlist.length;
            loadSong(songIndex);
            if (isAudioPlaying) audio.play().catch(e => console.error(e));
        }

        function nextTrack() {
            songIndex = (songIndex + 1) % playlist.length;
            loadSong(songIndex);
            if (isAudioPlaying) audio.play().catch(e => console.error(e));
        }

        audio.addEventListener('play', () => {
            isAudioPlaying = true;
            vinylDisc.classList.add('playing');
            soundEq.classList.add('active');
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        });

        audio.addEventListener('pause', () => {
            isAudioPlaying = false;
            vinylDisc.classList.remove('playing');
            soundEq.classList.remove('active');
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        });

        audio.addEventListener('ended', () => {
            nextTrack();
            audio.play().catch(e => console.error(e));
        });

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        // Teclado (r/startpages power-user shortcuts)
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') searchInput.blur();
                return;
            }
            if (e.key === '/') {
                e.preventDefault();
                searchInput.focus();
            } else if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextTrack();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevTrack();
            }
        });

        // Partículas de luz estelares sutiles en el fondo que reaccionan al compás
        const canvas = document.getElementById('soundCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.2,
                speed: Math.random() * 0.3 + 0.1
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * (isAudioPlaying ? 1.4 : 1), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * (isAudioPlaying ? 0.9 : 0.4)})`;
                ctx.shadowBlur = isAudioPlaying ? 6 : 2;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                p.y -= p.speed * (isAudioPlaying ? 1.8 : 1);
                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Inicializar
        loadSong(0);
    </script>
</body>
</html>
