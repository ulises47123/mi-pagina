<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           Startpage minimalista sobre dibujo a lápiz (tema carbón)
           - Sin cajas: el contenido va directo sobre la imagen y
             unas sombras suaves en los bordes le dan contraste.
           - Escritorio: reloj arriba-izq, buscador + dock abajo,
             música a la derecha.
           - Ventana angosta / vertical / celular: estilo pantalla de
             bloqueo (la cara arriba y el resto debajo, con scroll).
           ========================================================= */
        :root {
            --ink: #e8e8e8;
            --ink-dim: rgba(232, 232, 232, 0.64);
            --ink-faint: rgba(232, 232, 232, 0.4);
            --line: rgba(232, 232, 232, 0.14);
            --line-strong: rgba(232, 232, 232, 0.32);
            --hover: rgba(232, 232, 232, 0.09);
            --glass: rgba(14, 14, 14, 0.55);
            --shade: 8, 8, 8;
            --mono: 'JetBrains Mono', monospace;
            --pad: clamp(16px, 2.8vw, 44px);
            --music-w: clamp(250px, 25vw, 360px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            /* el texto crece un poco en pantallas grandes */
            font-size: clamp(15px, 0.5vw + 8.6px, 17px);
        }

        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--ink);
            background: #0d0d0d;
        }

        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

        /* Fondo fijo en su propia capa (así no se deforma al hacer scroll en el celular) */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url('bg.webp?v=5') no-repeat center 35% / cover;
        }

        .shade {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                linear-gradient(to left,
                    rgba(var(--shade), 0.86) 0,
                    rgba(var(--shade), 0.62) calc(var(--music-w) + var(--pad)),
                    rgba(var(--shade), 0) calc(var(--music-w) + var(--pad) + 18vw)),
                linear-gradient(to top, rgba(var(--shade), 0.72) 0, rgba(var(--shade), 0) 34%),
                radial-gradient(ellipse 45% 40% at 0 0, rgba(var(--shade), 0.6), rgba(var(--shade), 0));
        }

        /* ---------- GRILLA PRINCIPAL ---------- */
        .layout {
            height: 100%;
            padding: var(--pad);
            display: grid;
            grid-template-columns: minmax(0, 1fr) var(--music-w);
            grid-template-rows: auto minmax(0, 1fr) auto;
            grid-template-areas:
                "clock music"
                ".     music"
                "dock  music";
            column-gap: clamp(24px, 4vw, 72px);
        }

        .label {
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        /* ---------- RELOJ ---------- */
        .clock { grid-area: clock; animation: rise 0.6s ease-out both; }

        .clock-time {
            font-size: clamp(2.6rem, 9vh, 4.6rem);
            font-weight: 200;
            line-height: 1;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
        }

        .clock-date {
            margin-top: 0.6em;
            font-size: 0.76rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ink-dim);
            white-space: nowrap;
            text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7);
        }

        /* ---------- BUSCADOR + DOCK ---------- */
        .dock-area {
            grid-area: dock;
            justify-self: center;
            width: min(100%, 600px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: rise 0.6s 0.08s ease-out both;
        }

        .search-form {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 48px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--ink);
            font: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .search-input::placeholder { color: var(--ink-faint); }
        .search-input:focus { border-color: var(--line-strong); background: rgba(14, 14, 14, 0.75); }

        .search-orb-canvas {
            position: absolute;
            left: 16px;
            width: 22px;
            height: 22px;
            pointer-events: none;
        }

        .search-hint {
            position: absolute;
            right: 16px;
            font-family: var(--mono);
            font-size: 0.68rem;
            color: var(--ink-faint);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 0 6px;
            pointer-events: none;
        }

        .dock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
            padding: 5px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .dock-sep {
            width: 1px;
            height: 18px;
            margin: 0 6px;
            background: var(--line-strong);
        }

        .link {
            position: relative;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .link img {
            width: 17px;
            height: 17px;
            opacity: 0.72;
            transition: opacity 0.15s ease;
        }

        .link:hover, .link:focus-visible { background: var(--hover); transform: translateY(-2px); }
        .link:hover img, .link:focus-visible img { opacity: 1; }

        /* nombre arriba del icono */
        .link::after {
            content: attr(aria-label);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(3px);
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(14, 14, 14, 0.92);
            border: 1px solid var(--line);
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 5;
        }

        .link:hover::after, .link:focus-visible::after { opacity: 1; transform: translateX(-50%); }

        /* ---------- MÚSICA ---------- */
        .music {
            grid-area: music;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2.2vh, 18px);
            animation: rise 0.6s 0.14s ease-out both;
        }

        .music-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--ink-dim);
            transition: color 0.15s ease, background 0.15s ease;
        }

        .icon-btn:hover { color: var(--ink); background: var(--hover); }
        .icon-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .now-title {
            margin-top: 6px;
            font-size: 1.12rem;
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

        .ctrl-play {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--ink);
            color: #111;
            transition: transform 0.15s ease;
        }

        .ctrl-play:hover { transform: scale(1.06); }
        .ctrl-play svg { width: 16px; height: 16px; fill: currentColor; }

        .progress-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

        .progress {
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            border-radius: 3px;
            background: var(--line-strong);
            overflow: hidden;
            transition: height 0.15s ease;
        }

        .progress:hover .progress-track { height: 5px; }
        .progress-fill { width: 0%; height: 100%; background: var(--ink); }

        .times {
            display: flex;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.64rem;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        .tracklist {
            list-style: none;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0 -10px;
            padding: 4px 6px 24px;
            border-top: 1px solid var(--line);
            scrollbar-width: none;
            /* se desvanece abajo para indicar que hay más */
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent);
        }

        .tracklist::-webkit-scrollbar { display: none; }

        .track {
            width: 100%;
            display: grid;
            grid-template-columns: 26px minmax(0, 1fr);
            align-items: center;
            padding: 7px 8px;
            border-radius: 8px;
            text-align: left;
            line-height: 1.35;
            font-size: 0.86rem;
            color: var(--ink-dim);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .track:hover { background: var(--hover); color: var(--ink); }
        .track-num { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); }
        .track-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .track.active { color: var(--ink); background: var(--hover); box-shadow: inset 2px 0 0 var(--ink); }
        .track.active .track-num { color: var(--ink); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .clock, .dock-area, .music { animation: none; }
        }

        /* ---------- VENTANAS BAJAS ---------- */
        @media (max-height: 560px) and (min-width: 901px) {
            .dock-area { gap: 8px; }
            .search-input { height: 40px; }
            .link { width: 32px; height: 32px; }
            .link img { width: 15px; height: 15px; }
            .clock-date { margin-top: 0.4em; }
        }

        /* ---------- ANGOSTA / VERTICAL / CELULAR ---------- */
        @media (max-width: 900px), (max-aspect-ratio: 1/1) {
            body { height: auto; min-height: 100%; overflow-y: auto; }
            .shade { display: none; }

            .layout {
                height: auto;
                min-height: 100vh;
                min-height: 100svh;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto;
                grid-template-areas: "clock" "dock" "music";
                row-gap: 28px;
                padding: max(24px, env(safe-area-inset-top)) 16px 32px;
                /* oscurece desde la mitad hacia abajo; se mueve con el contenido */
                background: linear-gradient(to bottom,
                    rgba(var(--shade), 0.6) 0,
                    rgba(var(--shade), 0.05) 22vh,
                    rgba(var(--shade), 0.05) 38vh,
                    rgba(var(--shade), 0.88) 60vh,
                    rgba(var(--shade), 0.94) 100%);
            }

            /* deja ver la cara antes del buscador */
            .clock { min-height: 44vh; min-height: 44svh; }
            .clock-time { font-size: clamp(3rem, 16vw, 4.6rem); }

            .dock-area { width: min(100%, 560px); }

            /* dock en grilla de 7 x 2: nunca queda un icono suelto */
            .dock {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                width: min(100%, 420px);
                padding: 6px;
                border-radius: 22px;
            }
            .dock-sep { display: none; }
            .link { justify-self: center; }

            .music { width: min(100%, 560px); justify-self: center; }
            .tracklist {
                flex: none;
                overflow: visible;
                -webkit-mask-image: none;
                mask-image: none;
                padding-bottom: 0;
            }
        }

        /* ventana angosta pero apaisada (p. ej. media pantalla): menos espacio
           reservado para la cara, así la música aparece antes */
        @media (max-width: 900px) and (min-aspect-ratio: 1/1) {
            .clock { min-height: 24vh; }
        }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="layout">

        <!-- Reloj -->
        <header class="clock" data-region="reloj">
            <div class="clock-time" id="clockTime">00:00</div>
            <div class="clock-date" id="clockDate"></div>
        </header>

        <!-- Buscador + dock de accesos -->
        <main class="dock-area" data-region="dock">
            <form class="search-form" action="https://search.brave.com/search" method="GET" target="_blank" role="search">
                <input type="text" id="searchInput" name="q" class="search-input" placeholder="Buscar en Brave…" autocomplete="off" aria-label="Buscar en Brave">
                <canvas id="searchOrbCanvas" class="search-orb-canvas" width="44" height="44" aria-hidden="true"></canvas>
                <span class="search-hint">/</span>
            </form>

            <nav class="dock" aria-label="Accesos directos">
                <a class="link" href="https://claude.ai" target="_blank" rel="noopener" aria-label="Claude"><img src="icons/claude.svg" alt=""></a>
                <a class="link" href="https://gemini.google.com" target="_blank" rel="noopener" aria-label="Gemini"><img src="icons/gemini.svg" alt=""></a>
                <a class="link" href="https://chat.deepseek.com/" target="_blank" rel="noopener" aria-label="DeepSeek"><img src="icons/deepseek.svg" alt=""></a>
                <a class="link" href="https://chat.qwen.ai/" target="_blank" rel="noopener" aria-label="Qwen"><img src="icons/qwen.svg" alt=""></a>
                <a class="link" href="https://kimi.moonshot.cn/" target="_blank" rel="noopener" aria-label="Kimi"><img src="icons/kimi.svg" alt=""></a>
                <a class="link" href="https://notebooklm.google.com/" target="_blank" rel="noopener" aria-label="NotebookLM"><img src="icons/notebooklm.svg" alt=""></a>
                <span class="dock-sep" aria-hidden="true"></span>
                <a class="link" href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube"><img src="icons/youtube.svg" alt=""></a>
                <a class="link" href="https://mail.google.com" target="_blank" rel="noopener" aria-label="Gmail"><img src="icons/gmail.svg" alt=""></a>
                <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><img src="icons/instagram.svg" alt=""></a>
                <a class="link" href="https://www.reddit.com/" target="_blank" rel="noopener" aria-label="Reddit"><img src="icons/reddit.svg" alt=""></a>
                <a class="link" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub"><img src="icons/github.svg" alt=""></a>
                <a class="link" href="https://skills.sh/" target="_blank" rel="noopener" aria-label="Skills.sh"><img src="icons/skills.svg" alt=""></a>
                <span class="dock-sep" aria-hidden="true"></span>
                <a class="link" href="https://classroom.google.com/" target="_blank" rel="noopener" aria-label="Classroom"><img src="icons/classroom.svg" alt=""></a>
                <a class="link" href="https://ies5tello-juj.infd.edu.ar/aula/acceso.cgi" target="_blank" rel="noopener" aria-label="IES Tello"><img src="icons/ies_tello.svg" alt=""></a>
            </nav>
        </main>

        <!-- Música -->
        <section class="music" aria-label="Música" data-region="musica">
            <div>
                <div class="music-head">
                    <span class="label" id="musicCount">Música</span>
                    <button class="icon-btn" id="shuffleBtn" type="button" title="Mezclar el orden" aria-label="Mezclar el orden">
                        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                </div>
                <div class="now-title" id="trackTitle">—</div>
            </div>

            <div class="player-row">
                <div class="controls">
                    <button class="icon-btn" id="prevBtn" aria-label="Anterior">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-play" id="playBtn" aria-label="Reproducir">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="icon-btn" id="nextBtn" aria-label="Siguiente">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="progress-wrap">
                    <div class="progress" id="progressBar" role="slider" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                    </div>
                    <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
                </div>
            </div>

            <ol class="tracklist" id="trackList"></ol>

            <audio id="audioElement" preload="metadata"></audio>
        </section>
    </div>

    <!-- Thinking Orb (Jakub Antalik) en el buscador -->
    <script>
    (function initThinkingOrb() {
        const orbCanvas = document.getElementById('searchOrbCanvas');
        if (!orbCanvas) return;
        const octx = orbCanvas.getContext('2d');
        if (!octx) return;

        const size = 22;
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        orbCanvas.width = Math.round(size * dpr);
        orbCanvas.height = Math.round(size * dpr);

        const spin = 0.52;
        const cx = size / 2;
        const cy = size / 2;
        const radius = (size / 2) * 0.84;
        const latRings = 9;
        const lonDensity = 22;
        const rs = Math.pow(size / 300, 0.6) * 1.7;
        const speed = 2.4;

        function angleDelta(a, b) {
            return Math.atan2(Math.sin(a - b), Math.cos(a - b));
        }

        let focused = false;
        const searchInputEl = document.getElementById('searchInput');
        if (searchInputEl) {
            searchInputEl.addEventListener('focus', () => { focused = true; });
            searchInputEl.addEventListener('blur', () => { focused = false; });
        }

        function drawFrame(nowSec) {
            octx.setTransform(dpr, 0, 0, dpr, 0, 0);
            octx.clearRect(0, 0, size, size);

            const t = nowSec * (focused ? speed * 1.6 : speed);
            const tilt = 0.4 + 0.08 * Math.sin(t * 0.35);
            const st = Math.sin(tilt);
            const ct = Math.cos(tilt);
            const sy = Math.sin(t * spin);
            const cyw = Math.cos(t * spin);

            const proj = (x, y, z) => {
                const x1 = x * cyw + z * sy;
                const z1 = -x * sy + z * cyw;
                const y1 = y * ct - z1 * st;
                const z2 = y * st + z1 * ct;
                return [cx + x1 * radius, cy - y1 * radius, z2];
            };

            const scan = t * (spin + 1.2 * 3.8);
            const dots = [];

            for (let li = 0; li <= latRings; li++) {
                const lat = -Math.PI / 2 + (li / latRings) * Math.PI;
                const cosLat = Math.cos(lat);
                const sinLat = Math.sin(lat);
                const lonCount = Math.max(1, Math.round(Math.abs(cosLat) * lonDensity));

                for (let lj = 0; lj < lonCount; lj++) {
                    const lon = (lj / lonCount) * 2 * Math.PI;
                    const [px, py, z] = proj(cosLat * Math.cos(lon), sinLat, cosLat * Math.sin(lon));
                    const depth = (z + 1) / 2;
                    const d = angleDelta(lon + t * spin, scan);
                    const boost = Math.exp(-(d * d) / 0.2) * Math.max(0, z);
                    const r = Math.max(0.4, (0.5 + 1.6 * depth + 0.9 * boost) * rs);
                    const white = 0.62 - 0.54 * depth;
                    const alpha = 0.35 + 0.65 * Math.min(1, boost * 1.4 + depth * 0.4);
                    dots.push({ x: px, y: py, z, r, white, a: alpha });
                }
            }

            dots.sort((a, b) => a.z - b.z);

            for (let i = 0; i < dots.length; i++) {
                const pt = dots[i];
                // Sobre fondo oscuro: los puntos del frente son los más claros
                const g = Math.round((1 - Math.min(1, Math.max(0, pt.white))) * 230);
                const a = focused ? pt.a : pt.a * 0.75;
                octx.fillStyle = `rgba(${g}, ${g}, ${g}, ${a})`;
                octx.beginPath();
                octx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                octx.fill();
            }
        }

        let raf = 0;
        let running = true;
        function loop() {
            if (running) {
                drawFrame(performance.now() / 1000);
                raf = requestAnimationFrame(loop);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                running = false;
                cancelAnimationFrame(raf);
            } else {
                running = true;
                raf = requestAnimationFrame(loop);
            }
        });

        raf = requestAnimationFrame(loop);
    })();
    </script>

    <script src="music/playlist_data.js?v=2"></script>
    <script src="player.js?v=6"></script>
</body>
</html>
